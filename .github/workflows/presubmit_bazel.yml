name: Build and run Gfxstream tests via Bazel

on:
  workflow_call:
    inputs:
      # Which github runner to use:
      runner:
        type: string
        required: true

      # Additional args used in `bazel build <args>` and `bazel test <args>`:
      additional-bazel-args:
        type: string
        default: ''

      # Which targets to build. Defaults to everything, but platforms that can
      # not build the full target graph (e.g. macOS, which lacks the Linux-only
      # mesa/libdrm/guest dependencies) can override this with a curated list.
      build-targets:
        type: string
        default: '...'

      # Whether or not to run the `bazel test` step:
      run-tests:
        type: boolean
        default: true

      # Which graphics drivers/test environment to use. Defaults to the ANGLE +
      # SwiftShader environment. Platforms without a buildable SwiftShader (e.g.
      # macOS) can override this with `host`.
      graphics-drivers:
        type: string
        default: 'gles_angle_vulkan_swiftshader'

      # Extra flags passed only to the `bazel test` step (e.g. --test_env for
      # pointing the tests at a Vulkan driver). Not passed to `bazel build`.
      test-bazel-args:
        type: string
        default: ''

      # Which test targets to run when run-tests is true. Platforms that can only
      # run a subset (e.g. macOS) can override this with a curated list.
      test-targets:
        type: string
        default: >-
          host:gfxstream_framebuffer_tests
          host/vulkan:gfxstream_compositorvk_tests
          host/vulkan:gfxstream_emulatedphysicalmemory_tests
          host/vulkan:vk_common_operations_tests
          host/vulkan:vk_format_utils_tests
          tests/end2end:gfxstream_end2end_tests

permissions:
  contents: read

jobs:
  presubmit_bazel_workflow:
    runs-on: ${{ inputs.runner }}
    steps:
    - name: Free disk space
      if: runner.os == 'Linux'
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
      with:
        tool-cache: true

    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      with:
        # No step needs the token afterwards, so do not leave it
        # behind in .git/config.
        persist-credentials: false

    - name: Install bazel (Linux)
      if: runner.os == 'Linux'
      run: sudo bash toolchain/bazel/install_bazel.sh

    - name: Install toolchain dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo bash toolchain/bazel/install_toolchain_dependencies.sh

    - name: Install runtime dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get install -y libvulkan1

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      # molten-vk provides a Vulkan-on-Metal driver and vulkan-loader provides
      # libvulkan, which together give the host-driver tests a Vulkan
      # implementation to run against.
      run: brew install bazelisk molten-vk vulkan-loader

    - name: Load cache config
      run: cat .config/cache-config.env >> $GITHUB_ENV

    - name: Mount Bazel cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
      with:
        path: "~/bazel-disk-cache"
        key: ${{ format('{0}-{1}-bazel-disk-cache-{2}-{3}-{4}-', runner.os, runner.arch, env.CACHE_VERSION, github.ref_name, github.sha) }}
        restore-keys: |
          ${{ format('{0}-{1}-bazel-disk-cache-{2}-{3}-', runner.os, runner.arch, env.CACHE_VERSION, github.ref_name) || '' }}
          ${{ format('{0}-{1}-bazel-disk-cache-{2}-main-', runner.os, runner.arch, env.CACHE_VERSION) || '' }}
          ${{ format('{0}-{1}-bazel-disk-cache-{2}-', runner.os, runner.arch, env.CACHE_VERSION) || '' }}

    - name: Build
      # Workflow inputs reach the script through the environment rather than
      # being expanded into it, so that their contents can never be parsed as
      # shell code. They are deliberately left unquoted below so that the shell
      # still splits them into separate arguments.
      env:
        BUILD_TARGETS: ${{ inputs.build-targets }}
        ADDITIONAL_BAZEL_ARGS: ${{ inputs.additional-bazel-args }}
        GRAPHICS_DRIVERS: ${{ inputs.graphics-drivers }}
      run: |
        bazel build $BUILD_TARGETS \
          --disk_cache=$HOME/bazel-disk-cache \
          --graphics_drivers=$GRAPHICS_DRIVERS \
          --verbose_failures \
          $ADDITIONAL_BAZEL_ARGS

    - name: Test
      if: ${{ inputs.run-tests }}
      env:
        ADDITIONAL_BAZEL_ARGS: ${{ inputs.additional-bazel-args }}
        GRAPHICS_DRIVERS: ${{ inputs.graphics-drivers }}
        TEST_TARGETS: ${{ inputs.test-targets }}
        TEST_BAZEL_ARGS: ${{ inputs.test-bazel-args }}
      run: |
        # The variables below are deliberately unquoted so that the shell splits
        # them into separate arguments. Disable globbing so that a value such as
        # --test_arg=--gtest_filter=*Foo* is passed through literally rather than
        # being expanded against the files in the workspace.
        set -f
        bazel test \
          --disk_cache=$HOME/bazel-disk-cache \
          --graphics_drivers=$GRAPHICS_DRIVERS \
          --test_output=streamed \
          --verbose_failures \
          $TEST_TARGETS \
          $TEST_BAZEL_ARGS \
          $ADDITIONAL_BAZEL_ARGS
