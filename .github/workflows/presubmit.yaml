name: Gfxstream Presubmit

on:
  pull_request:
  push:
    branches-ignore:
      - main  # push events to main branch occur after PRs are merged, when the same checks were run

permissions:
  contents: read

concurrency:
  # limits the workflow to a single run per branch/PR
  group: ${{ github.workflow }}-${{ github.ref }}
  # previous runs are cancelled when a new run is started
  cancel-in-progress: true

jobs:
  run-buildozer:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      with:
        # No step needs the token afterwards, so do not leave it
        # behind in .git/config.
        persist-credentials: false
    - name: Install go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
      with:
        go-version: '1.23.1'
    - name: Install buildozer
      run: go install github.com/bazelbuild/buildtools/buildozer@latest
    - name: Validate formatting
      if: '!cancelled()'
      run: |
        if [[ $(buildozer '//...:__pkg__' format 2>&1) ]]; then
          echo "Please format BUILD.bazel files with \"buildozer '//...:__pkg__' format\"";
          exit 1;
        fi
    - name: Validate no unused loads
      if: '!cancelled()'
      run: |
        if [[ $(buildozer -stdout=true '//...:__pkg__' 'fix unusedLoads') ]]; then
          buildozer '//...:__pkg__' 'fix unusedLoads'
          echo "Please remove unused 'load' statements with \"buildozer '//...:__pkg__' 'fix unusedLoads'\"";
          exit 1;
        fi

  run-gfxstream-bazel-tests:
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      runner: ubuntu-22.04

  run-gfxstream-bazel-tests-asan:
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      # TODO(b/475886246): fix and remove `detect_leaks=0`
      # TODO(b/475885975): fix and remove `detect_odr_violation=0`
      additional-bazel-args: --config=asan --test_env=ASAN_OPTIONS=detect_leaks=0:detect_odr_violation=0
      runner: ubuntu-22.04

  run-gfxstream-bazel-tests-arm:
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      runner: ubuntu-22.04-arm
      # The arm runner is too slow:
      run-tests: false

  run-gfxstream-bazel-build-macos:
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      runner: macos-26
      # macOS can not build the full target graph: the Linux-only mesa/libdrm
      # guest dependencies and swiftshader's bundled LLVM (which has no macOS
      # config) do not build on Darwin. Build the host backend libraries, which
      # are the macOS deliverable and mirror the CMake/Meson host builds below.
      build-targets: >-
        //host:gfxstream_backend_static
        //host:gfxstream_backend_shared
        //host:gfxstream_backend
      # Use the default host driver environment: SwiftShader can not be built on
      # macOS. Vulkan-backed tests instead run against MoltenVK (installed via
      # brew), pointed at by the ANDROID_EMU_VK_LOADER_PATH / VK_*_FILES env
      # vars below.
      graphics-drivers: host
      run-tests: true
      # The GLES framebuffer test needs the ANGLE GLES driver and runs in a
      # separate job below, as do the end2end tests (which additionally need the
      # mesa guest driver and the kumquat server built on top of it).
      test-targets: >-
        //host:gfxstream_vsyncthread_tests
        //host/vulkan:vk_format_utils_tests
        //host/vulkan:gfxstream_emulatedphysicalmemory_tests
        //host/vulkan:gfxstream_emulatedphysicalqueue_tests
        //host/vulkan:vk_common_operations_tests
        //host/vulkan:gfxstream_displayvk_tests
        //host/vulkan:gfxstream_compositorvk_tests
      test-bazel-args: >-
        --test_env=ANDROID_EMU_VK_LOADER_PATH=/opt/homebrew/lib/libvulkan.dylib
        --test_env=VK_DRIVER_FILES=/opt/homebrew/etc/vulkan/icd.d/MoltenVK_icd.json
        --test_env=VK_ICD_FILENAMES=/opt/homebrew/etc/vulkan/icd.d/MoltenVK_icd.json

  # GLES tests use ANGLE (built on macOS) for the EGL/GLES driver, running on top
  # of MoltenVK for Vulkan. This uses the gles_angle_vulkan_moltenvk test
  # environment, which stages the ANGLE libraries and the system Vulkan loader
  # together and points them at MoltenVK.
  run-gfxstream-bazel-gles-build-macos:
    uses: ./.github/workflows/presubmit_bazel.yml
    with:
      runner: macos-26
      build-targets: //host:gfxstream_framebuffer_tests
      graphics-drivers: gles_angle_vulkan_moltenvk
      run-tests: true
      test-targets: //host:gfxstream_framebuffer_tests
      test-bazel-args: >-
        --test_env=GFXSTREAM_TESTING_VULKAN_LOADER=/opt/homebrew/lib/libvulkan.1.dylib
        --test_env=GFXSTREAM_TESTING_VULKAN_ICD=/opt/homebrew/etc/vulkan/icd.d/MoltenVK_icd.json

  run-gfxstream-cmake-build:
    runs-on: ubuntu-22.04
    steps:
    - name: Free disk space
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
      with:
        tool-cache: true
    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      with:
        # No step needs the token afterwards, so do not leave it
        # behind in .git/config.
        persist-credentials: false
    - name: Install toolchain dependencies
      run: sudo bash toolchain/cmake/install_toolchain_dependencies.sh
    - name: Configure Build
      run: |
        mkdir build && \
        cd build && \
        cmake .. -G Ninja
    - name: Build
      run: |
        cd build && \
        ninja

  run-gfxstream-cmake-build-macos:
    runs-on: macos-26
    steps:
    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      with:
        # No step needs the token afterwards, so do not leave it
        # behind in .git/config.
        persist-credentials: false
    - name: Install toolchain dependencies
      run: brew install cmake ninja
    - name: Configure Build
      run: |
        mkdir build && \
        cd build && \
        cmake .. -G Ninja
    - name: Build
      run: |
        cd build && \
        ninja

  run-gfxstream-meson-build:
    runs-on: ubuntu-22.04
    steps:
    - name: Free disk space
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
      with:
        tool-cache: true
    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      with:
        # No step needs the token afterwards, so do not leave it
        # behind in .git/config.
        persist-credentials: false
    - name: Install toolchain dependencies
      run: sudo bash toolchain/meson/install_toolchain_dependencies.sh
    - name: Configure Build
      run: |
        meson setup \
          -Ddefault_library=static \
          -Dgfxstream-build=host \
          build
    - name: Build
      run: |
        meson compile -C build

  run-gfxstream-meson-build-macos:
    runs-on: macos-26
    steps:
    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      with:
        # No step needs the token afterwards, so do not leave it
        # behind in .git/config.
        persist-credentials: false
    - name: Install toolchain dependencies
      run: brew install meson ninja molten-vk vulkan-loader
    - name: Configure Build
      run: |
        meson setup \
          -Ddefault_library=static \
          -Dgfxstream-build=host \
          build
    - name: Build
      run: |
        meson compile -C build

  run-gfxstream-meson-build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # No step needs the token afterwards, so do not leave it
          # behind in .git/config.
          persist-credentials: false
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: |
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-headers-git
      - name: Configure Build
        run: meson setup build
      - name: Build
        run: meson compile -C build
